; LYR 设备数据监听配置。
; 同时接收精德 EAP、森泉 PCB 文字喷印机、科视 LDI 的 HTTP 数据并转发至 QMS。
; 修改后重启 JingdeEapForwarder.exe 生效。

[LYR Listener]
; 默认 + 表示接收本机所有网卡的 HTTP 请求。实际部署时填中间电脑局域网 IP；首次监听可能需要管理员执行 README 中的 URL ACL 命令。
; 精德 EAP：/RestAPI/ZJDataCollectionReport、/RestAPI/EQPAlarmReport、/RestAPI/EQPStatusChangeReport。
JingdeEnabled=true
JingdeListenPrefix=http://+:8002/
JingdeAllowedDeviceIps=
; 森泉 PCB 文字喷印机：文档示例 MES 地址为 http://<服务IP>:6680/，通过 JSON method 区分接口。
HosonEnabled=true
HosonListenPrefix=http://+:6680/
HosonAllowedDeviceIps=
; -1=未配置扫码判定时拒绝响应，防止程序擅自决定打印或下料；0=需要打印；1=不需要打印。
HosonScanResultIsNg=-1
; 科视 LDI：/Status、/OEE、/Alarm、/ExposureResult、/Heart、/Mode；兼容旧地址 /HeartBeat。
KstEnabled=true
KstListenPrefix=http://+:9000/
KstAllowedDeviceIps=
; 单条设备请求的最大正文长度（字节）。
MaxRequestBytes=1048576

[QMS]
; 例如：http://192.168.1.98:8080 或 https://qms.company.local
QmsBaseUrl=http://127.0.0.1:8080
; 对应 QMS 后端 qms.integration.gateway.shared-token。请替换，且不要提交真实令牌。
GatewayToken=REPLACE_WITH_QMS_GATEWAY_TOKEN
TelemetryPath=/api/v1/equipment/telemetry
BatchSize=50
RetryIntervalSeconds=10
RequestTimeoutSeconds=20
UseTls12=true

[S1 MQTT]
; 仅转发科视数据。填写 S1 的真实设备连接参数后再启用。
S1MqttEnabled=false
S1MqttHost=192.168.3.128
S1MqttPort=1883
S1MqttProductId=
S1MqttDeviceNumber=KST001
S1MqttUserId=
S1MqttUsername=
S1MqttPassword=
S1MqttKeepAliveSeconds=30

[Display]
; 图形监控窗口中保留的数据流数量由显示列数和显示行数共同计算。
DisplayColumns=2
DisplayRows=2
; 用于现场运维记录的保留策略设置。
RecordRetentionDays=30
; 超过此秒数未收到设备上报时，在监控窗口提示为长时间空闲。
IdleDisconnectSeconds=10

[Storage]
; QMS 或网络故障时，设备数据保存在本地；QMS 成功接收后才删除。
QueueFile=.\data\pending-events.json
S1MqttQueueFile=.\data\pending-s1-mqtt.json
LogFile=.\logs\jingde-eap-forwarder.log
